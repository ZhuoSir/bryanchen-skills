<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图表</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    /* 设计令牌：语义角色。换肤只改这里（见 references/style-guide.md） */
    --color-paper:   #ffffff;   /* 白色纸面 */
    --color-paper-2: #f4f7fb;   /* 区域容器底/浅底（白纸上的极浅蓝灰） */
    --color-ink:     #1f2937;   /* 主文本/主描边 */
    --color-muted:   #5b6b80;   /* 次要文本/默认箭头 */
    --color-soft:    #8a919c;   /* 弱文本/辅助线 */
    --color-accent:  #2563eb;   /* 蓝焦点色：每张图最多 1-2 个元素 */
    --color-accent-tint: rgba(37,99,235,0.10);
    --color-link:    #0e7490;   /* HTTP/外部调用 */
    --color-rule:    rgba(31,41,55,0.14);  /* 细分隔线 */
    --font-sans:  "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    --font-serif: "Noto Serif SC", "Songti SC", "SimSun", serif;
    --font-mono:  ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  body {
    font-family: var(--font-sans);
    background: var(--color-paper);
    color: var(--color-ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 32px;
  }
  .frame { max-width: 1200px; width: 100%; }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;            /* 基线 12px 的 0.9 倍，保持 4 的倍数则用 12px 也可 */
    letter-spacing: 0.18em;
    color: var(--color-muted);
    margin-bottom: 8px;
  }
  h1 {
    font-family: var(--font-serif);
    font-size: 28px;
    font-weight: 400;
    letter-spacing: -0.01em;
    line-height: 1.2;
    margin-bottom: 24px;
  }
  svg { width: 100%; min-width: 900px; display: block; }
</style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">[图表类型] · DIAGRAM</p>
    <h1>[图表标题]</h1>

    <!-- 使用前：把 [slug] 替换为本图唯一标识（如 order-flow），title/desc 必须填写 -->
    <svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" role="img"
         aria-labelledby="[slug]-title [slug]-desc">
      <title id="[slug]-title">[图表标题]</title>
      <desc id="[slug]-desc">[一句话说明这张图展示了什么]</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#5b6b80"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#0e7490"/>
        </marker>

        <!-- 内联图标库（线性 16×16，见 references/icons.md；全 path 构造，防 self_check 网格告警） -->
        <!-- 用法：<use href="#icon-code" x="盒左+12" y="盒心y-8" width="16" height="16"
                  style="color:var(--color-ink)"/>  图标取色 = use 的 color（默认 ink），可换 muted/accent -->
        <symbol id="icon-user" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9.8 5.2 a1.8 1.8 0 1 0 -3.6 0 a1.8 1.8 0 1 0 3.6 0"/>
          <path d="M4.1 13.1 C4.5 10.9 6 9.7 8 9.7 C10 9.7 11.5 10.9 11.9 13.1"/>
        </g></symbol>
        <symbol id="icon-home" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3.6 7.7 L8 3.7 L12.4 7.7"/>
          <path d="M5.3 8.1 V12.8 H10.7 V8.1"/>
          <path d="M8 12.8 V10.7"/>
        </g></symbol>
        <symbol id="icon-star" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round">
          <path d="M8 2.4 L9.35 6.14 L13.33 6.27 L10.19 8.71 L11.29 12.53 L8 10.3 L4.71 12.53 L5.81 8.71 L2.67 6.27 L6.65 6.14 Z"/>
        </g></symbol>
        <symbol id="icon-code" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5.5 5 L2.5 8 L5.5 11"/>
          <path d="M10.5 5 L13.5 8 L10.5 11"/>
        </g></symbol>
        <symbol id="icon-server" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4.2 3.2 H11.8 V12.8 H4.2 Z"/>
          <path d="M4.2 6.4 H11.8"/>
          <path d="M4.2 9.6 H11.8"/>
        </g></symbol>
        <symbol id="icon-database" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4.2 4.2 C4.2 3.2 5.9 2.3 8 2.3 C10.1 2.3 11.8 3.2 11.8 4.2 V11.8 C11.8 12.8 10.1 13.7 8 13.7 C5.9 13.7 4.2 12.8 4.2 11.8 Z"/>
          <path d="M4.2 6.5 C4.2 7.5 5.9 8.4 8 8.4 C10.1 8.4 11.8 7.5 11.8 6.5"/>
          <path d="M4.2 9.4 C4.2 10.4 5.9 11.3 8 11.3 C10.1 11.3 11.8 10.4 11.8 9.4"/>
        </g></symbol>
        <symbol id="icon-globe" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12.7 8 a4.7 4.7 0 1 0 -9.4 0 a4.7 4.7 0 1 0 9.4 0"/>
          <path d="M8 3.3 a4.7 3 0 0 1 0 9.4 a4.7 3 0 0 1 0 -9.4"/>
          <path d="M3.3 8 H12.7"/>
        </g></symbol>
        <symbol id="icon-folder" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2.9 5.4 V12 H13.1 V6.4 H7.6 L6.6 5.4 Z"/>
        </g></symbol>
        <symbol id="icon-doc" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4.6 2.9 H9.5 L12.1 5.5 V13.1 H4.6 Z"/>
          <path d="M9.5 2.9 V5.5 H12.1"/>
        </g></symbol>
        <symbol id="icon-chart" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2.8 12.5 H13.2"/>
          <path d="M4.4 12.5 V6.6"/>
          <path d="M7.6 12.5 V8.9"/>
          <path d="M10.8 12.5 V4.9"/>
        </g></symbol>
        <symbol id="icon-gear" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11.9 8 a3.9 3.9 0 1 0 -7.8 0 a3.9 3.9 0 1 0 7.8 0"/>
          <path d="M8 2.3 V4.1"/><path d="M8 13.7 V11.9"/>
          <path d="M2.3 8 H4.1"/><path d="M13.7 8 H11.9"/>
        </g></symbol>
        <symbol id="icon-clock" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12.5 8 a4.5 4.5 0 1 0 -9 0 a4.5 4.5 0 1 0 9 0"/>
          <path d="M8 8 V4.2"/>
          <path d="M8 8 L10.3 9.5"/>
        </g></symbol>
        <symbol id="icon-shield" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4.6 3.4 H11.4 V8 C11.4 11.2 9.9 13 8 13.9 C6.1 13 4.6 11.2 4.6 8 Z"/>
          <path d="M6.7 8.4 L7.7 9.4 L9.6 7.2"/>
        </g></symbol>
        <symbol id="icon-mail" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3.2 5.2 H12.8 V10.8 H3.2 Z"/>
          <path d="M3.2 5.2 L8 9.2 L12.8 5.2"/>
        </g></symbol>
        <symbol id="icon-wallet" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3.2 5.6 H12.8 V10.4 H3.2 Z"/>
          <path d="M3.2 7.4 H12.8"/>
          <path d="M11.1 9.2 a1.1 1.1 0 1 0 -2.2 0 a1.1 1.1 0 1 0 2.2 0"/>
        </g></symbol>
        <symbol id="icon-check" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3.5 8.3 L6.9 11.7 L12.5 4.9"/>
        </g></symbol>
        <symbol id="icon-alert" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3.2 L13.4 12.4 H2.6 Z"/>
          <path d="M8 6.6 V9.4"/>
          <path d="M8.95 11.1 a0.95 0.95 0 1 0 -1.9 0 a0.95 0.95 0 1 0 1.9 0"/>
        </g></symbol>
        <symbol id="icon-send" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2.6 8.8 L13.8 2.4 L10 13.6 L7.2 9.6 Z"/>
          <path d="M7.2 9.6 L13.8 2.4"/>
        </g></symbol>
        <symbol id="icon-users" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7.6 4.6 a1.4 1.4 0 1 0 -2.8 0 a1.4 1.4 0 1 0 2.8 0"/>
          <path d="M3.6 11.6 C4.1 9.8 5 8.9 6.2 8.9 C7.4 8.9 8.3 9.8 8.8 11.6"/>
          <path d="M11.7 3.2 a1.1 1.1 0 1 0 -2.2 0 a1.1 1.1 0 1 0 2.2 0"/>
          <path d="M9.5 9.1 C10.2 7.6 11.9 7.3 13.3 8.3 L13.3 11.6"/>
        </g></symbol>
        <symbol id="icon-mobile" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5.4 3 H10.6 V13 H5.4 Z"/>
          <path d="M6.8 11.8 H9.2"/>
        </g></symbol>
        <symbol id="icon-monitor" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3.6 3.2 H12.4 V10.2 H3.6 Z"/>
          <path d="M8 10.2 V12.6"/>
          <path d="M5.4 12.6 H10.6"/>
        </g></symbol>
        <symbol id="icon-cpu" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4.2 4.2 H11.8 V11.8 H4.2 Z"/>
          <path d="M6.4 6.4 H9.6 V9.6 H6.4 Z"/>
          <path d="M8 2.2 V4.2"/><path d="M8 11.8 V13.8"/>
          <path d="M2.2 8 H4.2"/><path d="M11.8 8 H13.8"/>
        </g></symbol>
        <symbol id="icon-network" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4.2 4.2 H11.8"/>
          <path d="M4.2 4.2 L8 12.2"/>
          <path d="M11.8 4.2 L8 12.2"/>
          <path d="M5.7 4.2 a1.5 1.5 0 1 0 -3 0 a1.5 1.5 0 1 0 3 0"/>
          <path d="M13.3 4.2 a1.5 1.5 0 1 0 -3 0 a1.5 1.5 0 1 0 3 0"/>
          <path d="M9.5 12.2 a1.5 1.5 0 1 0 -3 0 a1.5 1.5 0 1 0 3 0"/>
        </g></symbol>
        <symbol id="icon-cart" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6.2 6.4 V4.9 a1.8 1.8 0 0 1 3.6 0 V6.4"/>
          <path d="M3.4 6.4 L4.9 11.8 H11.1 L12.6 6.4 Z"/>
          <path d="M7.1 12.9 a0.8 0.8 0 1 0 -1.6 0 a0.8 0.8 0 1 0 1.6 0"/>
          <path d="M10.5 12.9 a0.8 0.8 0 1 0 -1.6 0 a0.8 0.8 0 1 0 1.6 0"/>
        </g></symbol>
        <symbol id="icon-building" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4.2 2.8 H11.8 V13.2 H4.2 Z"/>
          <path d="M8 2.8 V13.2"/>
          <path d="M4.2 6.4 H11.8"/>
          <path d="M4.2 9.8 H11.8"/>
        </g></symbol>
        <symbol id="icon-bank" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3.2 7 L8 3.4 L12.8 7"/>
          <path d="M4.6 7 H11.4 V13 H4.6 Z"/>
          <path d="M6.3 8.4 V12.2"/><path d="M8 8.4 V12.2"/><path d="M9.7 8.4 V12.2"/>
        </g></symbol>
        <symbol id="icon-lock" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 7.6 V5.4 a2 2 0 0 1 4 0 V7.6"/>
          <path d="M5.2 7.6 H10.8 V13 H5.2 Z"/>
          <path d="M8.7 10.4 a0.7 0.7 0 1 0 -1.4 0 a0.7 0.7 0 1 0 1.4 0"/>
        </g></symbol>
        <symbol id="icon-key" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6.3 5.6 a1.9 1.9 0 1 0 -3.8 0 a1.9 1.9 0 1 0 3.8 0"/>
          <path d="M6.3 5.6 H12.8"/>
          <path d="M12.8 5.6 V8.6"/><path d="M10.6 5.6 V7.2"/>
        </g></symbol>
        <symbol id="icon-search" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.4 6.9 a3.5 3.5 0 1 0 -7 0 a3.5 3.5 0 1 0 7 0"/>
          <path d="M9.5 9.5 L13.2 13.2"/>
        </g></symbol>
        <symbol id="icon-bell" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4.2 11.4 C4.4 7.6 5.9 4.8 8 4.8 C10.1 4.8 11.6 7.6 11.8 11.4"/>
          <path d="M4.2 11.4 H11.8"/>
          <path d="M8 4.8 V3.4"/>
          <path d="M8 11.4 V13"/>
        </g></symbol>
        <symbol id="icon-calendar" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3.4 3.6 H12.6 V13 H3.4 Z"/>
          <path d="M3.4 6.2 H12.6"/>
          <path d="M6.2 3.6 V2.4"/><path d="M9.8 3.6 V2.4"/>
          <path d="M5.2 8.2 H7.4"/><path d="M9 8.2 H10.8"/>

        <symbol id="icon-flag" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">

        <symbol id="icon-target" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">

          <path d="M10.4 8 a2.4 2.4 0 1 0 -4.8 0 a2.4 2.4 0 1 0 4.8 0"/>

        <symbol id="icon-box" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">

          <path d="M5.5 7 L8 9.5 L10.5 7"/>

      </defs>

      <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- 先画箭头，再画节点（z 序：线在节点下）。在此替换为你的内容 -->

    </svg>
  </div>
</body>
</html>
