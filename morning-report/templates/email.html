<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{SUBJECT}}</title>
<style>
  /* 移动优先：窄屏单列堆叠、字号收小；宽屏（≥641px）才两栏并排 */
  @media only screen and (max-width:640px) {
    .sheet   { padding:20px 16px 24px !important; border-radius:12px !important; }
    .wrap    { padding:10px 8px 28px !important; }
    .title   { font-size:26px !important; margin-top:5px !important; }
    .quote   { font-size:12.5px !important; }
    .kicker  { font-size:9px !important; letter-spacing:2px !important; }
    .sec-label { font-size:12.5px !important; margin:22px 2px 9px !important; }
    .card-pad  { padding:11px 13px !important; }
    .duo       { display:block !important; }
    .duo-cell  { display:block !important; width:100% !important; padding:0 !important; }
    .duo-cell + .duo-cell { display:block !important; margin-top:26px !important; }
    .duo .sec-label { margin-top:0 !important; }
    .head-cell { display:block !important; width:100% !important; padding-right:0 !important;
                 text-align:left !important; }
    .head-q    { margin-top:10px !important; }
    table, td, div { max-width:100% !important; }
    .weather-note { font-size:12px !important; }
    .market-td  { white-space:normal !important; }
    .title-row  { font-size:13.5px !important; }
  }
</style>
</head>
<body style="margin:0;padding:0;background:{{BG}};-webkit-text-size-adjust:100%;">
<div class="wrap" style="max-width:900px;margin:0 auto;padding:16px 10px 40px;">

  <div class="sheet" style="background:{{SHEET}};border-radius:16px;padding:28px 30px 32px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;color:{{TEXT}};line-height:1.75;">

    <!-- 头部：左=刊名/日期，右=寄语（窄屏自动堆叠） -->
    <div style="padding:2px 0 16px;border-bottom:3px solid {{ACCENT}};">
      <table width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;">
        <tr>
          <td class="head-cell" style="vertical-align:bottom;padding-right:16px;">
            <div class="kicker" style="font-size:10px;letter-spacing:3px;color:{{ACCENT}};font-weight:700;line-height:16px;">{{HEAD_ICON}}{{KICKER}}</div>
            <div class="title" style="font-size:33px;font-weight:800;margin-top:7px;letter-spacing:-0.5px;">{{TITLE}}</div>
            <div style="font-size:13px;color:{{MUTED}};margin-top:2px;">{{DATE}}</div>
          </td>
          <td class="head-cell head-q" style="vertical-align:bottom;text-align:right;width:47%;">
            <div class="quote" style="font-size:13px;color:{{QUOTE_TEXT}};font-style:italic;line-height:1.65;">{{QUOTE}}</div>
            <div style="font-size:12px;color:{{MUTED}};margin-top:6px;">—— 爱你的悠悠</div>
          </td>
        </tr>
      </table>
    </div>

{{BLOCKS}}

  </div>

</div>
</body>
</html>
