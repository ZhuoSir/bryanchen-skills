<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>早晚报系统架构</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; background: #f7f5f2;
         min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .frame { max-width: 1200px; width: 100%; }
  .eyebrow { font-family: ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.18em;
             color: #5c6470; margin-bottom: 8px; }
  h1 { font-family: "Noto Serif SC", "Songti SC", serif; font-size: 28px; font-weight: 400; margin-bottom: 24px; }
  svg { width: 100%; min-width: 900px; display: block; }
</style>
</head>
<body>
  <div class="frame">
    
    <svg viewBox="60 30 880 350" xmlns="http://www.w3.org/2000/svg" role="img"
         aria-labelledby="morning-arch-title morning-arch-desc">
      <title id="morning-arch-title">早晚报系统架构</title>
      <desc id="morning-arch-desc">展示五路数据源并行抓取，经组装引擎生成晨报或晚报，再通过邮件与微信投递的完整链路</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#5c6470"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#c2451e"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#1d4ed8"/>
        </marker>
      </defs>
      <rect width="100%" height="100%" fill="#f7f5f2"/>

      <!-- 数据源 → 抓取引擎：五条并行肘形线，连接点沿左缘分散 -->
      <path d="M 232,60  L 296,60  Q 304,60  304,68  L 304,132 Q 304,140 312,140 L 344,140" fill="none" stroke="#1d4ed8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <path d="M 232,132 L 280,132 Q 288,132 288,140 L 288,164 Q 288,172 296,172 L 344,172" fill="none" stroke="#1d4ed8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <path d="M 232,204 L 344,204" fill="none" stroke="#1d4ed8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <path d="M 232,276 L 280,276 Q 288,276 288,268 L 288,244 Q 288,236 296,236 L 344,236" fill="none" stroke="#1d4ed8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <path d="M 232,348 L 296,348 Q 304,348 304,340 L 304,276 Q 304,268 312,268 L 344,268" fill="none" stroke="#1d4ed8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

      <!-- 抓取引擎 → 组装 -->
      <path d="M 472,204 L 560,204" fill="none" stroke="#5c6470" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="484" y="184" width="56" height="12" rx="2" fill="#f7f5f2"/>
      <text x="512" y="193" text-anchor="middle" font-size="8" font-family="ui-monospace,Menlo,monospace" fill="#5c6470">JSON × 5</text>

      <!-- 组装 → 投递：两路 -->
      <path d="M 688,192 L 736,192 Q 744,192 744,184 L 744,124 Q 744,116 752,116 L 784,116" fill="none" stroke="#c2451e" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="700" y="108" width="52" height="12" rx="2" fill="#f7f5f2"/>
      <text x="726" y="117" text-anchor="middle" font-size="8" font-family="ui-monospace,Menlo,monospace" fill="#c2451e">HTML 邮件</text>

      <path d="M 688,216 L 736,216 Q 744,216 744,224 L 744,284 Q 744,292 752,292 L 784,292" fill="none" stroke="#5c6470" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="704" y="280" width="44" height="12" rx="2" fill="#f7f5f2"/>
      <text x="726" y="289" text-anchor="middle" font-size="8" font-family="ui-monospace,Menlo,monospace" fill="#5c6470">图文消息</text>

      <!-- 数据源节点（外部系统） -->
      <rect x="80" y="44" width="152" height="32" rx="6" fill="rgba(35,39,46,0.03)" stroke="rgba(35,39,46,0.30)"/>
      <text x="156" y="64" text-anchor="middle" font-size="12" font-weight="600" fill="#23272e">Open-Meteo 天气</text>

      <rect x="80" y="116" width="152" height="32" rx="6" fill="rgba(35,39,46,0.03)" stroke="rgba(35,39,46,0.30)"/>
      <text x="156" y="136" text-anchor="middle" font-size="12" font-weight="600" fill="#23272e">60s 新闻 API</text>

      <rect x="80" y="188" width="152" height="32" rx="6" fill="rgba(35,39,46,0.03)" stroke="rgba(35,39,46,0.30)"/>
      <text x="156" y="208" text-anchor="middle" font-size="12" font-weight="600" fill="#23272e">量子位 / TC / InfoQ</text>

      <rect x="80" y="260" width="152" height="32" rx="6" fill="rgba(35,39,46,0.03)" stroke="rgba(35,39,46,0.30)"/>
      <text x="156" y="280" text-anchor="middle" font-size="12" font-weight="600" fill="#23272e">虎扑热帖 + 赛程</text>

      <rect x="80" y="332" width="152" height="32" rx="6" fill="rgba(35,39,46,0.03)" stroke="rgba(35,39,46,0.30)"/>
      <text x="156" y="352" text-anchor="middle" font-size="12" font-weight="600" fill="#23272e">微博/知乎/抖音/头条</text>

      <!-- 抓取引擎（焦点） -->
      <rect x="344" y="120" width="128" height="168" rx="6" fill="rgba(194,69,30,0.08)" stroke="#c2451e"/>
      <text x="408" y="196" text-anchor="middle" font-size="12" font-weight="600" fill="#23272e">并行抓取</text>
      <text x="408" y="212" text-anchor="middle" font-size="9" font-family="ui-monospace,Menlo,monospace" fill="#5c6470">5 scripts · 降级链</text>
      <text x="408" y="228" text-anchor="middle" font-size="9" font-family="ui-monospace,Menlo,monospace" fill="#5c6470">零依赖 · 免 Key</text>

      <!-- 组装 -->
      <rect x="560" y="176" width="128" height="56" rx="6" fill="#ffffff" stroke="#23272e"/>
      <text x="624" y="200" text-anchor="middle" font-size="12" font-weight="600" fill="#23272e">组装引擎</text>
      <text x="624" y="216" text-anchor="middle" font-size="9" font-family="ui-monospace,Menlo,monospace" fill="#5c6470">摘要 · 归类 · 模板</text>

      <!-- 投递 -->
      <rect x="784" y="92" width="136" height="48" rx="6" fill="#ffffff" stroke="#23272e"/>
      <text x="852" y="114" text-anchor="middle" font-size="12" font-weight="600" fill="#23272e">163 邮箱</text>
      <text x="852" y="130" text-anchor="middle" font-size="9" font-family="ui-monospace,Menlo,monospace" fill="#5c6470">smtp :465</text>

      <rect x="784" y="268" width="136" height="48" rx="6" fill="#ffffff" stroke="#23272e"/>
      <text x="852" y="290" text-anchor="middle" font-size="12" font-weight="600" fill="#23272e">微信</text>
      <text x="852" y="306" text-anchor="middle" font-size="9" font-family="ui-monospace,Menlo,monospace" fill="#5c6470">im_send_file</text>

      </svg>
  </div>
</body>
</html>
